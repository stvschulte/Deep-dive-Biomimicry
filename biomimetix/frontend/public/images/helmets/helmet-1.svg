<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e2418"/>
      <stop offset="100%" stop-color="#07130a"/>
    </radialGradient>
    <radialGradient id="shell1" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1a5a6e"/>
      <stop offset="60%" stop-color="#0d3a4a"/>
      <stop offset="100%" stop-color="#071e28"/>
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="440" fill="url(#bg1)"/>

  <!-- Road Race Helmet — aerodynamic profile, side view -->

  <!-- Main shell -->
  <path d="M110 310 Q90 240 110 170 Q140 90 200 60 Q260 35 320 42 Q390 52 430 110 Q470 165 465 230 Q460 270 440 310 Z"
        fill="url(#shell1)" stroke="#3fcfc4" stroke-width="1.5" opacity="0.95"/>

  <!-- Surface highlight — top gloss -->
  <path d="M180 75 Q240 52 310 58 Q370 66 410 108"
        fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="5" stroke-linecap="round"/>

  <!-- Vents — horizontal slots -->
  <path d="M162 145 Q200 138 238 143" fill="none" stroke="#3fcfc4" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M152 172 Q196 164 240 169" fill="none" stroke="#3fcfc4" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M148 199 Q196 191 244 197" fill="none" stroke="#3fcfc4" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  <path d="M150 226 Q200 218 248 224" fill="none" stroke="#3fcfc4" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M158 252 Q206 245 250 250" fill="none" stroke="#3fcfc4" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

  <!-- Front visor edge -->
  <path d="M110 310 Q115 325 130 330 Q145 335 160 328" fill="none" stroke="#3fcfc4" stroke-width="2" opacity="0.6"/>

  <!-- Chin straps -->
  <path d="M122 305 Q108 340 118 370 Q124 385 138 382 Q150 380 152 366"
        fill="none" stroke="#3fcfc4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M440 305 Q452 340 442 370 Q436 385 422 382 Q410 380 408 366"
        fill="none" stroke="#3fcfc4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Buckle -->
  <rect x="284" y="370" width="32" height="18" rx="4" fill="none" stroke="#3fcfc4" stroke-width="1.5" opacity="0.6"/>

  <!-- EPS foam edge at bottom -->
  <path d="M112 308 Q275 322 438 308" fill="none" stroke="rgba(63,207,196,0.3)" stroke-width="3" stroke-linecap="round"/>

  <!-- Label -->
  <text x="300" y="420" text-anchor="middle" fill="rgba(63,207,196,0.6)" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.12em">ROAD RACE — AERODYNAMIC</text>
</svg>
