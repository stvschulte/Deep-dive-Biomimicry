<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0c0a"/>
      <stop offset="100%" stop-color="#07130a"/>
    </radialGradient>
    <radialGradient id="shell5" cx="38%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#6a2018"/>
      <stop offset="60%" stop-color="#3e130c"/>
      <stop offset="100%" stop-color="#1e0906"/>
    </radialGradient>
    <radialGradient id="mips5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(192,114,90,0.4)"/>
      <stop offset="100%" stop-color="rgba(192,114,90,0)"/>
    </radialGradient>
  </defs>

  <rect width="600" height="440" fill="url(#bg5)"/>

  <!-- Modern Race Helmet with MIPS — visible slip-plane liner -->

  <!-- MIPS slip layer (inner, slightly offset) -->
  <path d="M118 308 Q100 242 120 172 Q148 93 210 66 Q265 44 322 50 Q385 60 424 116 Q458 170 456 240 Q454 292 432 316"
        fill="none" stroke="rgba(192,114,90,0.35)" stroke-width="8" stroke-dasharray="6 4" opacity="0.8"/>

  <!-- Main outer shell -->
  <path d="M110 300 Q92 234 112 163 Q140 84 202 57 Q258 35 316 42 Q380 52 420 110 Q454 165 452 234 Q450 284 428 308 Z"
        fill="url(#shell5)" stroke="#c0725a" stroke-width="1.5" opacity="0.95"/>

  <!-- Top gloss highlight -->
  <path d="M178 70 Q242 50 314 56 Q374 64 414 108"
        fill="none" stroke="rgba(255,255,255,0.26)" stroke-width="5" stroke-linecap="round"/>

  <!-- Multiple vents — modern race pattern -->
  <path d="M160 138 Q196 130 230 136" fill="none" stroke="#c0725a" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M152 162 Q192 154 234 160" fill="none" stroke="#c0725a" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M148 188 Q192 179 238 185" fill="none" stroke="#c0725a" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M148 215 Q194 206 240 212" fill="none" stroke="#c0725a" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  <path d="M152 242 Q198 234 244 240" fill="none" stroke="#c0725a" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M160 268 Q204 261 246 267" fill="none" stroke="#c0725a" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

  <!-- MIPS badge indicator -->
  <circle cx="388" cy="130" r="18" fill="rgba(192,114,90,0.15)" stroke="#c0725a" stroke-width="1.5" opacity="0.8"/>
  <text x="388" y="135" text-anchor="middle" fill="#c0725a" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">MIPS</text>

  <!-- Chin strap -->
  <path d="M122 296 Q106 334 116 368 Q122 384 136 382 Q148 380 150 366"
        fill="none" stroke="#c0725a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M426 296 Q440 334 430 368 Q424 384 410 382 Q398 380 396 366"
        fill="none" stroke="#c0725a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <rect x="282" y="368" width="30" height="18" rx="4" fill="none" stroke="#c0725a" stroke-width="1.5" opacity="0.6"/>

  <text x="300" y="420" text-anchor="middle" fill="rgba(192,114,90,0.6)" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.12em">MODERN RACE — MIPS SYSTEM</text>
</svg>
