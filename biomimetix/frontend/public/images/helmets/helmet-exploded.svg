    <path d="M468 316 Q540 306 600 306 Q660 306 730 316"
          fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>
    <!-- Foam cell texture suggestion -->
    <circle cx="530" cy="350" r="10" fill="none" stroke="rgba(63,90,40,0.18)" stroke-width="1.5"/>
    <circle cx="560" cy="368" r="9" fill="none" stroke="rgba(63,90,40,0.18)" stroke-width="1.5"/>
    <circle cx="600" cy="352" r="11" fill="none" stroke="rgba(63,90,40,0.18)" stroke-width="1.5"/>
    <circle cx="640" cy="368" r="9" fill="none" stroke="rgba(63,90,40,0.18)" stroke-width="1.5"/>
    <circle cx="668" cy="350" r="10" fill="none" stroke="rgba(63,90,40,0.18)" stroke-width="1.5"/>
  </g>
