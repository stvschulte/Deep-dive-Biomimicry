    <ellipse cx="600" cy="565" rx="32" ry="18" fill="rgba(180,140,90,0.22)" stroke="rgba(140,100,60,0.2)" stroke-width="1"/>
    <ellipse cx="660" cy="570" rx="30" ry="18" fill="rgba(180,140,90,0.22)" stroke="rgba(140,100,60,0.2)" stroke-width="1"/>
  </g>
