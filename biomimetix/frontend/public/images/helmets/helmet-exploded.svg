  <line x1="490" y1="404" x2="450" y2="512" stroke="#263020" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.22"/>
  <line x1="710" y1="404" x2="750" y2="512" stroke="#263020" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.22"/>

