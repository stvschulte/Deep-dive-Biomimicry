  <line x1="480" y1="194" x2="440" y2="302" stroke="#263020" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.25"/>
  <line x1="720" y1="194" x2="760" y2="302" stroke="#263020" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.25"/>

  <!-- ─── Component 2: EPS Foam Liner ─── -->
  <g filter="url(#drop)">
    <path d="M452 310 Q490 295 600 295 Q710 295 748 310 Q782 326 782 352 Q782 375 748 390 Q710 404 600 404 Q490 404 452 390 Q418 375 418 352 Q418 326 452 310 Z"
