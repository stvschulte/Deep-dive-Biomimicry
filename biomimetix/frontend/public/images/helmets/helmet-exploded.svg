<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <defs>
    <radialGradient id="bg-exp" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e2ddd4"/>
    </radialGradient>
    <filter id="drop">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2f3a28" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg-exp)"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" fill="#263020" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.06em">CYCLING HELMET — EXPLODED VIEW</text>

  <!-- ─── Component 1: Outer Polycarbonate Shell ─── -->
  <!-- Top center -->
  <g filter="url(#drop)">
    <path d="M440 90 Q480 72 600 72 Q720 72 760 90 Q800 108 808 140 Q816 164 800 178 Q760 194 600 194 Q440 194 400 178 Q384 164 392 140 Q400 108 440 90 Z"
          fill="#9fb675" opacity="0.92"/>
    <path d="M460 96 Q540 82 600 82 Q660 82 740 96"
          fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round"/>
    <!-- Vent slots on shell -->
    <line x1="490" y1="130" x2="550" y2="128" stroke="#263020" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="490" y1="148" x2="560" y2="146" stroke="#263020" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="640" y1="130" x2="700" y2="128" stroke="#263020" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="635" y1="148" x2="705" y2="146" stroke="#263020" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  </g>
  <text x="600" y="220" text-anchor="middle" fill="#263020" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Outer Shell</text>
  <text x="600" y="240" text-anchor="middle" fill="#4e5d43" font-family="Inter, Arial, sans-serif" font-size="12">Polycarbonate — impact distribution</text>

