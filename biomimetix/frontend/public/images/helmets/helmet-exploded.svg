  <text x="600" y="668" text-anchor="middle" fill="#4e5d43" font-family="Inter, Arial, sans-serif" font-size="12">Moisture-wicking fabric — fit and comfort</text>

  <!-- ─── Component 4: Retention / Fit System ─── (right side) -->
  <g filter="url(#drop)">
    <rect x="880" y="290" width="140" height="110" rx="22" fill="#c98f65" opacity="0.92"/>
    <!-- Dial wheel -->
    <circle cx="950" cy="345" r="32" fill="#a06840" opacity="0.9"/>
    <circle cx="950" cy="345" r="20" fill="#c98f65" opacity="0.8"/>
    <circle cx="950" cy="345" r="8" fill="#7a4e2a"/>
    <!-- Knob texture lines -->
    <line x1="950" y1="320" x2="950" y2="325" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
    <line x1="950" y1="365" x2="950" y2="370" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
    <line x1="925" y1="345" x2="930" y2="345" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
    <line x1="970" y1="345" x2="975" y2="345" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
