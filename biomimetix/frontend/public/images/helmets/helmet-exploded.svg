  <!-- Connector to shell -->
  <line x1="880" y1="320" x2="808" y2="160" stroke="#263020" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.22"/>

  <!-- ─── Component 5: Strap System ─── (left side) -->
  <g filter="url(#drop)">
    <rect x="178" y="295" width="130" height="95" rx="18" fill="#758f66" opacity="0.92"/>
    <!-- Y-strap junction -->
    <path d="M243 322 L218 368 M243 322 L268 368" fill="none" stroke="#263020" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M243 322 L243 304" fill="none" stroke="#263020" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <!-- Buckle rect -->
    <rect x="224" y="358" width="38" height="20" rx="5" fill="none" stroke="#fffaf0" stroke-width="2" opacity="0.7"/>
    <line x1="243" y1="358" x2="243" y2="378" stroke="#fffaf0" stroke-width="1.5" opacity="0.6"/>
  </g>
  <text x="243" y="420" text-anchor="middle" fill="#263020" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Strap System</text>
  <text x="243" y="440" text-anchor="middle" fill="#4e5d43" font-family="Inter, Arial, sans-serif" font-size="12">Y-straps &amp; buckle — retention</text>
  <!-- Connector to shell -->
  <line x1="308" y1="318" x2="400" y2="162" stroke="#263020" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.22"/>

  <!-- Center connector spine -->
  <line x1="600" y1="194" x2="600" y2="295" stroke="#263020" stroke-width="2" stroke-dasharray="8 6" opacity="0.2"/>
  <line x1="600" y1="404" x2="600" y2="515" stroke="#263020" stroke-width="2" stroke-dasharray="8 6" opacity="0.2"/>

  <!-- Footer note -->
  <text x="600" y="738" text-anchor="middle" fill="rgba(38,48,32,0.45)" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="0.06em">BioMimetix AI — Product Component Breakdown</text>
</svg>
