[phases.setup]
nixPkgs = ["nodejs_22", "python312"]

[phases.install]
cmds = [
  "pip install -r biomimetix/backend/requirements.txt",
  "cd biomimetix/frontend && npm install"
]

[phases.build]
cmds = ["cd biomimetix/frontend && VITE_API_BASE=/api npm run build"]

[start]
cmd = "cd biomimetix/backend && uvicorn api:app --host 0.0.0.0 --port $PORT"
